architectury {
    common rootProject.enabled_platforms.split(',')
}

// Dummy platform for common compile
def platform = "fabric"

repositories {
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.kosmx.dev/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // For Accessories:
    maven { url 'https://maven.wispforest.io/releases' }
    maven { url 'https://maven.su5ed.dev/releases' }
    maven { url 'https://maven.fabricmc.net' }

    mavenLocal()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}")
    modImplementation("maven.modrinth:spell-engine:${rootProject.spell_engine_version}-${platform}")
    modImplementation("maven.modrinth:spell-power:${rootProject.spell_power_version}-${platform}")

    // Globe HUD (built from ../globehud, `gradlew publishToMavenLocal` there first)
    modImplementation("com.cleannrooster:globehud-${platform}:${rootProject.globehud_version}")

    // Accessories glue lives in common, guarded by a mod-loaded check at runtime
    modCompileOnly "io.wispforest:owo-lib:${rootProject.owo_version}" // Accessories needs this
    modImplementation("io.wispforest:accessories-common:${rootProject.accessories_version}")
}

plugins {
    id 'com.gradleup.shadow'
}

def platform = project.name

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.kosmx.dev/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven { url 'https://maven.wispforest.io/releases' }

    mavenLocal()
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}")
    modImplementation("maven.modrinth:spell-engine:${rootProject.spell_engine_version}-${platform}")
    modImplementation("maven.modrinth:spell-power:${rootProject.spell_power_version}-${platform}")

    include(modImplementation("com.cleannrooster:globehud-${platform}:${rootProject.globehud_version}"))

    // Fabric specific
    modCompileOnly("com.terraformersmc:modmenu:${rootProject.mod_menu_version}")
    modCompileOnly("dev.emi:trinkets:${rootProject.trinkets_version}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraft_compat_version": rootProject.minecraft_compat_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
